services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-finder-api
    environment:
      GIN_MODE: release
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: email-finder-frontend
    depends_on:
      - api
    ports:
      - "4200:80"
    restart: unless-stopped
